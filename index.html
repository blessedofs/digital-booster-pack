<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Big Hit Society | Digital Pack Opening</title>

  <style>
    :root{
      --ink:#111827;
      --yellow:#facc15;
      --blue:#2563eb;
      --purple:#7c3aed;
      --pink:#ec4899;
      --green:#10b981;
      --red:#ef4444;
      --card:#ffffff;
      --muted:#6b7280;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      color:white;
      background:
        radial-gradient(circle at 20% 20%, rgba(37,99,235,.30), transparent 34%),
        radial-gradient(circle at 80% 10%, rgba(124,58,237,.30), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(236,72,153,.22), transparent 28%),
        linear-gradient(160deg,#0f172a,#1f2937);
    }

    .wrap{
      width:min(470px,100%);
    }

    .brand{
      text-align:center;
      font-weight:1000;
      letter-spacing:.17em;
      font-size:.8rem;
      color:var(--yellow);
      margin-bottom:8px;
    }

    .panel{
      background:#fff;
      color:var(--ink);
      border-radius:28px;
      padding:20px;
      box-shadow:0 24px 70px rgba(0,0,0,.36);
      overflow:hidden;
      position:relative;
    }

    h1{
      margin:0;
      text-align:center;
      font-size:clamp(1.7rem,6vw,2.25rem);
      line-height:1.05;
    }

    .sub{
      text-align:center;
      color:var(--muted);
      margin:8px 0 16px;
    }

    .stage{
      min-height:470px;
      border-radius:24px;
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.95) 0 10%, transparent 11%),
        radial-gradient(circle at 50% 50%, #c4b5fd 0 20%, #8b5cf6 21% 42%, #4c1d95 43% 100%);
      border:4px solid #4f46e5;
    }

    .stars{
      position:absolute;
      inset:0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 0 1px, transparent 1.5px);
      background-size:24px 24px;
      opacity:.45;
    }

    .pack{
      position:relative;
      width:220px;
      height:330px;
      border-radius:18px;
      background:
        linear-gradient(140deg,#111827 0 18%,#2563eb 18% 39%,#7c3aed 39% 64%,#ec4899 64% 100%);
      border:5px solid #f8fafc;
      box-shadow:0 20px 32px rgba(0,0,0,.35);
      z-index:3;
      overflow:hidden;
      transform-origin:50% 50%;
      transition:opacity .35s ease, transform .35s ease;
    }

    .pack:before{
      content:"";
      position:absolute;
      inset:10px;
      border:2px solid rgba(255,255,255,.55);
      border-radius:12px;
    }

    .packTop,.packBottom{
      position:absolute;
      left:0;
      width:100%;
      height:28px;
      background:
        repeating-linear-gradient(
          90deg,
          #e5e7eb 0 8px,
          #9ca3af 8px 12px
        );
      z-index:2;
    }

    .packTop{top:0}
    .packBottom{bottom:0}

    .packLogo{
      position:absolute;
      inset:50px 20px 60px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:#fff;
      text-shadow:0 4px 0 rgba(0,0,0,.25);
      z-index:1;
    }

    .packLogo .small{
      font-size:.75rem;
      letter-spacing:.18em;
      font-weight:900;
      color:var(--yellow);
      margin-bottom:8px;
    }

    .packLogo .big{
      font-size:2.3rem;
      line-height:.92;
      font-weight:1000;
    }

    .packLogo .mini{
      margin-top:14px;
      font-size:.85rem;
      font-weight:800;
      opacity:.9;
    }

    .tear{
      position:absolute;
      left:50%;
      top:22px;
      width:0;
      height:0;
      transform:translateX(-50%);
      border-left:18px solid transparent;
      border-right:18px solid transparent;
      border-top:0 solid white;
      z-index:5;
      opacity:0;
    }

    .pack.opening{
      animation:packShake .7s ease-in-out;
    }

    .pack.opened{
      animation:packOpen .85s ease forwards;
    }

    @keyframes packShake{
      0%,100%{transform:rotate(0)}
      20%{transform:rotate(-5deg)}
      40%{transform:rotate(5deg)}
      60%{transform:rotate(-4deg)}
      80%{transform:rotate(4deg)}
    }

    @keyframes packOpen{
      0%{transform:scale(1);opacity:1}
      35%{transform:scale(1.08) rotate(-2deg);opacity:1}
      100%{transform:translateY(-80px) scale(.7);opacity:0}
    }

    .cards{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:6;
    }

    .cardStack{
      position:relative;
      width:240px;
      height:350px;
    }

    .pokeCard{
      position:absolute;
      inset:0;
      border-radius:18px;
      background:#f8fafc;
      border:5px solid #111827;
      box-shadow:0 18px 30px rgba(0,0,0,.32);
      padding:12px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      opacity:0;
      transform:translateY(50px) scale(.85) rotate(2deg);
      transition:opacity .35s ease, transform .35s ease;
    }

    .pokeCard.show{
      opacity:1;
      transform:translateY(0) scale(1) rotate(0);
    }

    .pokeCard.hit{
      border-color:var(--yellow);
      box-shadow:
        0 0 0 4px rgba(250,204,21,.35),
        0 18px 30px rgba(0,0,0,.32);
    }

    .rarity{
      align-self:flex-start;
      font-size:.69rem;
      font-weight:1000;
      letter-spacing:.07em;
      padding:6px 9px;
      border-radius:999px;
      background:#111827;
      color:white;
      margin-bottom:5px;
    }

    .pokeImg{
      width:185px;
      height:185px;
      object-fit:contain;
      filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));
    }

    .pokeName{
      font-size:1.55rem;
      font-weight:1000;
      text-transform:capitalize;
      text-align:center;
      margin-top:4px;
    }

    .pokeMeta{
      color:var(--muted);
      font-size:.82rem;
      font-weight:800;
      margin-top:4px;
      text-align:center;
    }

    .tapHint{
      position:absolute;
      bottom:14px;
      width:100%;
      left:0;
      text-align:center;
      color:#fff;
      font-size:.86rem;
      font-weight:1000;
      text-shadow:0 2px 2px rgba(0,0,0,.4);
      z-index:10;
    }

    .controls{
      display:grid;
      gap:10px;
      margin-top:16px;
    }

    button{
      width:100%;
      border:0;
      border-radius:16px;
      padding:15px 16px;
      font-size:1rem;
      font-weight:1000;
      cursor:pointer;
      transition:transform .12s ease;
    }

    button:active{transform:scale(.98)}

    #openBtn{
      background:var(--yellow);
      color:#111827;
    }

    #nextBtn{
      display:none;
      background:#2563eb;
      color:white;
    }

    #newPackBtn{
      display:none;
      background:#111827;
      color:white;
    }

    #soundBtn{
      background:#e5e7eb;
      color:#111827;
    }

    .summary{
      display:none;
      margin-top:14px;
      padding:14px;
      border-radius:16px;
      background:#f3f4f6;
      text-align:center;
      font-weight:900;
    }

    .loading{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      background:rgba(255,255,255,.86);
      color:#111827;
      font-weight:1000;
      z-index:30;
    }

    .burst{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      pointer-events:none;
      font-size:4rem;
      z-index:100;
      animation:pop .85s ease;
    }

    @keyframes pop{
      0%{transform:scale(.35);opacity:0}
      45%{transform:scale(1.35);opacity:1}
      100%{transform:scale(1);opacity:0}
    }

    .footer{
      text-align:center;
      color:#d1d5db;
      font-size:.74rem;
      line-height:1.35;
      margin-top:10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">BIG HIT SOCIETY</div>

    <main class="panel">
      <h1>DIGITAL PACK OPENING</h1>
      <p class="sub">Crack the pack and reveal your digital pulls.</p>

      <section class="stage">
        <div class="stars"></div>

        <div class="pack" id="pack">
          <div class="packTop"></div>
          <div class="packBottom"></div>
          <div class="packLogo">
            <div class="small">BIG HIT SOCIETY</div>
            <div class="big">DIGITAL<br>BOOSTER</div>
            <div class="mini">5 RANDOM ENCOUNTERS</div>
          </div>
        </div>

        <div class="cards" id="cards">
          <div class="cardStack">
            <div class="pokeCard" id="activeCard">
              <div class="rarity" id="rarity">COMMON</div>
              <img class="pokeImg" id="pokeImg" alt="Pokemon" />
              <div class="pokeName" id="pokeName"></div>
              <div class="pokeMeta" id="pokeMeta"></div>
            </div>
          </div>
        </div>

        <div class="tapHint" id="tapHint">TAP OPEN PACK</div>
        <div class="loading" id="loading">Building your pack…</div>
      </section>

      <div class="summary" id="summary"></div>

      <div class="controls">
        <button id="openBtn">✨ OPEN PACK</button>
        <button id="nextBtn">➡️ REVEAL NEXT CARD</button>
        <button id="newPackBtn">🔄 OPEN ANOTHER PACK</button>
        <button id="soundBtn">🔊 Sound: ON</button>
      </div>
    </main>

    <div class="footer">
      Fan-made Big Hit Society experience. Pokémon names and artwork belong to their respective rights holders.
    </div>
  </div>

  <div class="burst" id="burst">✨⚡✨</div>

<script>
  const PACK_SIZE = 5;
  let packCards = [];
  let index = 0;
  let soundOn = true;
  let busy = false;

  function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function beep(freq=440, duration=.1){
    if(!soundOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(.045, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function chooseTier(position){
    // Last card is guaranteed at least RARE.
    const roll = Math.random()*100;

    if(position === PACK_SIZE - 1){
      if(roll < 3) return "SECRET";
      if(roll < 15) return "ULTRA RARE";
      return "RARE";
    }

    if(roll < 1.5) return "ULTRA RARE";
    if(roll < 9) return "RARE";
    return "COMMON";
  }

  function pickPokemonId(tier){
    const rareIds = [6,9,18,26,65,94,130,131,143,149,212,248,282,306,330,350,376,445,448,468,475,635,706,784,887,937,998];
    const ultraIds = [3,6,9,94,130,149,150,151,248,249,250,376,382,383,384,445,448,493,643,644,646,716,717,718,791,792,800,888,889,890,1007,1008];
    const secretIds = [25,6,94,130,149,150,151,249,250,384,493,700,791,792,800,1007,1008];

    let pool = null;
    if(tier === "RARE") pool = rareIds;
    if(tier === "ULTRA RARE") pool = ultraIds;
    if(tier === "SECRET") pool = secretIds;

    if(pool){
      return pool[Math.floor(Math.random()*pool.length)];
    }
    return Math.floor(Math.random()*1025)+1;
  }

  async function buildPack(){
    const loading = document.getElementById("loading");
    loading.style.display = "grid";
    packCards = [];

    try{
      for(let i=0;i<PACK_SIZE;i++){
        const tier = chooseTier(i);
        const id = pickPokemonId(tier);
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        if(!response.ok) throw new Error("API error");
        const pokemon = await response.json();

        const shiny = Math.random() < 0.02;
        const artwork = shiny
          ? pokemon.sprites.other["official-artwork"].front_shiny
          : pokemon.sprites.other["official-artwork"].front_default;

        packCards.push({
          id:pokemon.id,
          name:pokemon.name.replaceAll("-"," "),
          rarity:tier,
          shiny,
          artwork:artwork || pokemon.sprites.front_default
        });
      }
    }catch(err){
      console.error(err);
      alert("Could not load the pack. Check your internet connection and try again.");
    }finally{
      loading.style.display = "none";
    }
  }

  async function openPack(){
    if(busy) return;
    busy = true;

    const openBtn = document.getElementById("openBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pack = document.getElementById("pack");
    const cards = document.getElementById("cards");
    const tapHint = document.getElementById("tapHint");

    openBtn.disabled = true;
    tapHint.textContent = "RIPPING PACK…";
    pack.classList.add("opening");
    beep(420,.08);

    await wait(700);
    pack.classList.remove("opening");
    pack.classList.add("opened");
    beep(640,.08);
    await wait(800);

    pack.style.display = "none";
    cards.style.display = "flex";
    tapHint.textContent = "CARD 1 OF 5";
    index = 0;

    await showCard(index);

    openBtn.style.display = "none";
    nextBtn.style.display = "block";
    openBtn.disabled = false;
    busy = false;
  }

  async function showCard(i){
    const card = document.getElementById("activeCard");
    const rarity = document.getElementById("rarity");
    const img = document.getElementById("pokeImg");
    const name = document.getElementById("pokeName");
    const meta = document.getElementById("pokeMeta");
    const tapHint = document.getElementById("tapHint");
    const burst = document.getElementById("burst");

    const p = packCards[i];

    card.classList.remove("show","hit");
    await wait(100);

    rarity.textContent = p.shiny ? `✨ SHINY • ${p.rarity}` : p.rarity;
    img.src = p.artwork;
    img.alt = p.name;
    name.textContent = p.shiny ? `✨ ${p.name}` : p.name;
    meta.textContent = `Pokédex #${p.id} • Card ${i+1} of ${PACK_SIZE}`;

    if(i === PACK_SIZE-1 || p.rarity === "ULTRA RARE" || p.rarity === "SECRET" || p.shiny){
      card.classList.add("hit");
    }

    card.classList.add("show");
    tapHint.textContent = `CARD ${i+1} OF ${PACK_SIZE}`;

    beep(520 + i*50,.08);

    if(p.rarity === "SECRET" || p.shiny){
      burst.style.display = "grid";
      setTimeout(()=>burst.style.display="none",850);
      setTimeout(()=>beep(800,.12),100);
      setTimeout(()=>beep(980,.18),220);
    }
  }

  async function nextCard(){
    if(busy) return;
    busy = true;

    const nextBtn = document.getElementById("nextBtn");
    const newPackBtn = document.getElementById("newPackBtn");
    const summary = document.getElementById("summary");
    const tapHint = document.getElementById("tapHint");

    index++;

    if(index < PACK_SIZE){
      await showCard(index);

      if(index === PACK_SIZE-1){
        nextBtn.textContent = "🔥 REVEAL FINAL HIT";
      }
    }else{
      nextBtn.style.display = "none";
      newPackBtn.style.display = "block";

      const bestOrder = {"COMMON":1,"RARE":2,"ULTRA RARE":3,"SECRET":4};
      const best = packCards
        .slice()
        .sort((a,b)=>(b.shiny-a.shiny) || (bestOrder[b.rarity]-bestOrder[a.rarity]))[0];

      summary.style.display = "block";
      summary.textContent = best.shiny
        ? `✨ Pack Hit: SHINY ${best.name.toUpperCase()}!`
        : `🔥 Pack Hit: ${best.rarity} ${best.name.toUpperCase()}!`;

      tapHint.textContent = "PACK COMPLETE";
      beep(680,.1);
      setTimeout(()=>beep(820,.1),100);
      setTimeout(()=>beep(980,.18),200);
    }

    busy = false;
  }

  async function resetPack(){
    if(busy) return;
    busy = true;

    const pack = document.getElementById("pack");
    const cards = document.getElementById("cards");
    const openBtn = document.getElementById("openBtn");
    const nextBtn = document.getElementById("nextBtn");
    const newPackBtn = document.getElementById("newPackBtn");
    const summary = document.getElementById("summary");
    const tapHint = document.getElementById("tapHint");

    await buildPack();

    pack.className = "pack";
    pack.style.display = "block";
    cards.style.display = "none";
    openBtn.style.display = "block";
    nextBtn.style.display = "none";
    nextBtn.textContent = "➡️ REVEAL NEXT CARD";
    newPackBtn.style.display = "none";
    summary.style.display = "none";
    tapHint.textContent = "TAP OPEN PACK";
    index = 0;

    busy = false;
  }

  document.getElementById("openBtn").addEventListener("click", openPack);
  document.getElementById("nextBtn").addEventListener("click", nextCard);
  document.getElementById("newPackBtn").addEventListener("click", resetPack);

  document.getElementById("soundBtn").addEventListener("click", e=>{
    soundOn = !soundOn;
    e.target.textContent = soundOn ? "🔊 Sound: ON" : "🔇 Sound: OFF";
    if(soundOn) beep(600,.08);
  });

  buildPack();
</script>
</body>
</html>
